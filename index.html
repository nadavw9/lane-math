<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lane Math — Phase 3</title>
    <style>
      :root { color-scheme: dark; }
      /*
        Phone-shaped by default. GDD §9.1 targets 9:21 portrait, and validating
        layout against a desktop window is how the Phase 3 failure banner ended
        up below the fold. 393x852 is the reference device.
      */
      body {
        margin: 0;
        background: #0e1015;
        color: #f2f4f8;
        font-family: system-ui, sans-serif;
        display: flex;
        gap: 16px;
        padding: 8px;
        align-items: flex-start;
      }
      #app {
        width: 393px;
        height: 852px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        border-radius: 18px;
        overflow: hidden;
        flex: 0 0 auto;
      }
      #app canvas { display: block; }
      #levels {
        display: grid;
        grid-template-columns: repeat(4, auto);
        gap: 4px;
        align-content: start;
      }
      #levels button {
        font: 11px system-ui, sans-serif;
        padding: 4px 6px;
        background: #232833;
        color: #8a909c;
        border: 1px solid #333c47;
        border-radius: 4px;
        cursor: pointer;
      }
      #levels button.active { background: #3f6ea8; color: #fff; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="levels"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
