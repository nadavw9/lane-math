<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lane Math — Phase 3</title>
    <style>
      /*
       * The game's one typeface (GDD §9.0: no system fonts).
       *
       * Bundled rather than fetched: the game must render identically offline
       * and inside the APK, where there is no Google Fonts to reach. Digits are
       * the entire UI (§9.2), so this is not decoration — it is the interface.
       *
       * `swap` so a slow load shows fallback digits rather than no digits. A
       * blank board is the failure mode this project keeps having.
       */
      /*
       * PROVENANCE — the file is the LATIN subset of Outfit 800:
       *   fonts.gstatic.com/s/outfit/v15/QGYyz_MVcBeNP4NjuGObqx1XmO1I4bCyO4a0Ew.woff2
       *   unicode-range U+0000-00FF, U+2000-206F, U+2212, ...
       *
       * It was the LATIN-EXT subset until 2026-08-21, taken by a `| head -1`
       * over a css2 response that returns TWO @font-face blocks. latin-ext
       * starts at U+0100, so the file held no digits, no `=` and no
       * punctuation, and every glyph in the game silently fell back to
       * system-ui. Take the block whose unicode-range STARTS AT U+0000; there
       * is no unicode-range descriptor here, so whatever is in the file is
       * everything the game gets. `node tools/font-coverage.mjs` proves it.
       */
      @font-face {
        font-family: "Outfit";
        src: url("./assets/fonts/outfit-800.woff2") format("woff2");
        font-weight: 800;
        font-display: swap;
      }

      :root { color-scheme: dark; }
      /*
        Phone-shaped by default. GDD §9.1 targets 9:21 portrait, and validating
        layout against a desktop window is how the Phase 3 failure banner ended
        up below the fold. 393x852 is the reference device.
      */
      body {
        margin: 0;
        background: #0e1015;
        color: #f2f4f8;
        font-family: system-ui, sans-serif;
        display: flex;
        gap: 16px;
        padding: 8px;
        align-items: flex-start;
      }
      #app {
        width: 393px;
        height: 852px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        border-radius: 18px;
        overflow: hidden;
        flex: 0 0 auto;
      }
      #app canvas { display: block; }
      #levels {
        display: grid;
        grid-template-columns: repeat(4, auto);
        gap: 4px;
        align-content: start;
      }
      #levels button {
        font: 11px system-ui, sans-serif;
        padding: 4px 6px;
        background: #232833;
        color: #8a909c;
        border: 1px solid #333c47;
        border-radius: 4px;
        cursor: pointer;
      }
      #levels button.active { background: #3f6ea8; color: #fff; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="levels"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
