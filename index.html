<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover is required for env(safe-area-inset-*) to report
      anything but zero. Without it a notch and a gesture bar are invisible to
      CSS and the board draws underneath them.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Lane Math — Phase 3</title>
    <style>
      /*
       * The game's one typeface (GDD §9.0: no system fonts).
       *
       * Bundled rather than fetched: the game must render identically offline
       * and inside the APK, where there is no Google Fonts to reach. Digits are
       * the entire UI (§9.2), so this is not decoration — it is the interface.
       *
       * `swap` so a slow load shows fallback digits rather than no digits. A
       * blank board is the failure mode this project keeps having.
       */
      /*
       * PROVENANCE — the file is the LATIN subset of Outfit 800:
       *   fonts.gstatic.com/s/outfit/v15/QGYyz_MVcBeNP4NjuGObqx1XmO1I4bCyO4a0Ew.woff2
       *   unicode-range U+0000-00FF, U+2000-206F, U+2212, ...
       *
       * It was the LATIN-EXT subset until 2026-08-21, taken by a `| head -1`
       * over a css2 response that returns TWO @font-face blocks. latin-ext
       * starts at U+0100, so the file held no digits, no `=` and no
       * punctuation, and every glyph in the game silently fell back to
       * system-ui. Take the block whose unicode-range STARTS AT U+0000; there
       * is no unicode-range descriptor here, so whatever is in the file is
       * everything the game gets. `node tools/font-coverage.mjs` proves it.
       */
      @font-face {
        font-family: "Outfit";
        src: url("./assets/fonts/outfit-800.woff2") format("woff2");
        font-weight: 800;
        font-display: swap;
      }

      :root { color-scheme: dark; }
      /*
        Phone-shaped by default. GDD §9.1 targets 9:21 portrait, and validating
        layout against a desktop window is how the Phase 3 failure banner ended
        up below the fold. 393x852 is the reference device.
      */
      /*
       * THE PAGE IS THE VIEWPORT. Nothing here may have a fixed pixel size.
       *
       * `#app` used to be hard-coded to 393x852 — the reference device — so the
       * frame ignored the actual screen entirely. On a phone with browser
       * chrome the bottom of the pool fell off, and body padding plus the debug
       * panel's flex gap pushed the commit button past the right edge. Measured
       * at 393x852 in a browser it still overflowed by 139x302px; the design
       * viewport was never actually fitting, it just happened to put the canvas
       * where a screenshot would catch it.
       *
       * Height comes from JS because CSS cannot see the VISUAL viewport, and
       * that is the only measurement that tells the truth while browser chrome
       * slides in and out.
       */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        background: #0e1015;
        color: #f2f4f8;
        font-family: system-ui, sans-serif;
        /* Notches, punch-holes and the gesture bar. §9.1's 12px bottom anchor
           sits exactly where a gesture bar does. */
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        box-sizing: border-box;
      }
      #app {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        overflow: hidden;
      }
      /*
       * The level picker is a DEVELOPMENT affordance and must never take
       * layout space from the board. Out of flow entirely, and gone on
       * anything phone-shaped.
       */
      #levels {
        position: fixed;
        right: 4px;
        bottom: 4px;
        z-index: 2;
        display: grid;
        grid-template-columns: repeat(4, auto);
        gap: 4px;
        align-content: start;
        opacity: 0.85;
      }
      @media (max-width: 820px) {
        #levels { display: none; }
      }
      #app canvas { display: block; }
      #levels button {
        font: 11px system-ui, sans-serif;
        padding: 4px 6px;
        background: #232833;
        color: #8a909c;
        border: 1px solid #333c47;
        border-radius: 4px;
        cursor: pointer;
      }
      #levels button.active { background: #3f6ea8; color: #fff; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="levels"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
