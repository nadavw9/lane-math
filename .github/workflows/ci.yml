name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

# Default: read-only contents. Write scopes only on deploy (below).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Every gate in one job: they share an npm install and none of them is slow.
  # Split them out only when one starts costing minutes on its own.
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The named gates below are all inside `vitest run`, but they are called
      # out separately so a failure names ITSELF in the CI log rather than
      # arriving as "1 of ~548 tests failed".
      - name: Brightness gate (GDD 9.1 — tokens clear 3:1 on every world)
        run: npx vitest run src/art/brightness-gate.test.ts

      - name: Retry path (GDD 9.5 — restart emits exactly one render)
        run: npx vitest run src/game/retry.test.ts

      - name: Flight bound (frame-dependent correctness, CLAUDE.md 8)
        run: npx vitest run src/renderer/flights.test.ts

      - name: Save-recovery gate (corrupt primary → backup / recovery raw)
        run: npx vitest run src/economy/save-recovery.test.ts

      # The shipped level payload must carry exactly what the loader reads
      # (GDD 10). A field the build strips but the game wants is a runtime
      # crash on a device; metrics creeping back is 549KB nobody asked for.
      - name: Shipped levels (GDD 10 — metrics do not ship)
        run: npx vitest run src/game/shipped-levels.test.ts

      # Authored ladder still solvable / in-band under the current solver.
      # Local `npm run curate:verify` was green and deterministic at this tip.
      - name: Ladder curation verify
        run: npm run curate:verify

      # One vitest run: default reporter for the log + JSON count floor so a
      # silent suite shrink (deleted file / broken include) cannot stay green.
      - name: Full suite (≥548)
        run: node tools/assert-suite-size.mjs

      # ATLASES MUST REGENERATE TO THE SAME BYTES. The operators atlas could
      # not be rebuilt for months because nobody recorded the flags, and the
      # tool's defaults produce a different frame size. An asset whose build
      # command is unknown cannot be maintained.
      - name: Atlas reproducibility
        run: npm run atlas:verify

      # BASE MATTERS: Pages serves from /lane-math/, so the assets have to be
      # built against that prefix. Capacitor and local dev stay at "/", which is
      # why this is a flag here rather than a setting in vite.config.
      #
      # Track A: default prod build excludes window.laneMath harness. Boot /
      # font / viewport gates still need the harness, so CI builds twice —
      # Pages artifact = harness-off; smoke suite = harness-on.
      - name: Build (Pages / default prod — harness off)
        run: npm run build -- --base=/lane-math/

      - name: Assert default prod excludes review harness (regression gate, not security proof)
        run: node tools/assert-no-prod-harness.mjs

      - name: Report web build size
        run: |
          echo "### Web build (Pages / harness off)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh dist >> "$GITHUB_STEP_SUMMARY"
          du -b dist | tail -1 | awk '{printf "%d bytes\n", $1}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Deploy artifact path (exact): dist-pages/  ← harness-OFF Pages/APK prod.
      # upload-pages-artifact consumes dist-pages ONLY. Harness-on rebuild below
      # overwrites ./dist for smoke/font/viewport; it must NEVER be the deploy input.
      - name: Park Pages artefact (harness-off → dist-pages)
        run: rm -rf dist-pages && mv dist dist-pages

      - name: Build (boot gates — harness on)
        env:
          VITE_LANE_MATH_HARNESS: "1"
        run: npm run build -- --base=/lane-math/

      # Positive smoke: harness-on dist must contain window.laneMath surface.
      # STRING SCAN = regression gate only, not security proof.
      - name: Assert harness-on build exposes review harness
        run: node tools/assert-harness-present.mjs

      # BOOT SMOKE — the gate the unit suite structurally cannot be.
      # Three silent-blank failures so far, all with green CI: a wrong asset
      # directory, an awaited Capacitor proxy, and PixiJS deadlocking across
      # split chunks. None is a logic bug; all three exist only in the built
      # artefact, so this loads dist/ in a real browser and asserts it comes up.
      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium

      - name: Boot smoke — served at the Pages base
        env:
          SMOKE_BASE: /lane-math/
        run: node tools/smoke.mjs

      # THE ESCAPE HATCH HAS TO KEEP WORKING. Sprites are the default, so the
      # run above is the one that asserts them; this proves ?sprites=0 still
      # boots on the procedural path, which is also what draws if an atlas ever
      # fails to load. A fallback nobody exercises is a fallback that has
      # already rotted.
      - name: Boot smoke — procedural escape hatch
        env:
          SMOKE_BASE: /lane-math/
          SMOKE_QUERY: "?sprites=0"
        run: node tools/smoke.mjs

      # THE BOARD MUST FIT ON A REAL PHONE, not just on the design viewport.
      # It shipped with #app hard-coded to 393x852, so the frame ignored the
      # screen: on a device with browser chrome the pool fell off the bottom and
      # the commit button was clipped at the right. Measured at the design size
      # in a browser it STILL overflowed by 139x302px — one viewport is how a
      # layout ships broken on every other one.
      - name: Viewport fit — 16:9 through 21:9
        env:
          SMOKE_BASE: /lane-math/
        run: node tools/verify-viewports.mjs

      # FONT COVERAGE — the other gate that only the artefact can answer.
      # The bundled Outfit file was the latin-ext subset (unicode-range starts
      # at U+0100), so it contained no digits, no `=` and no punctuation, and
      # every glyph in the game silently fell back to system-ui for weeks. A
      # missing glyph 404s nothing and logs nothing; it is only visible in
      # pixels, which is exactly what this measures.
      - name: Font coverage — every glyph the UI draws
        env:
          # The artefact is built for the Pages base, so the server has to mount
          # there. Without this every asset 404s and the inventory is empty —
          # which is how this step failed on its first CI run.
          SMOKE_BASE: /lane-math/
        run: node tools/font-coverage.mjs

      # Supply-chain VISIBILITY only — covers ALL deps (prod + build/dev).
      # Non-blocking: findings do not fail the job or block Pages deploy.
      # Green / continue-on-error ≠ secure supply chain.
      - name: Dependency audit (all deps, non-blocking visibility)
        continue-on-error: true
        run: |
          echo "### npm audit (all dependencies — visibility, not security proof)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm audit || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "#### Production-only summary (informational; does not replace all-deps audit)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm audit --omit=dev || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist-pages

  # MASTER ONLY. The gates run on every branch so a change can be judged by CI
  # before it reaches master, but a branch must never publish to production.
  deploy:
    needs: gates
    if: github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
